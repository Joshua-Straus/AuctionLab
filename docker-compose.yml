services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auction_simulator
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: auction
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction -d auction_simulator"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://auction:auction@db:5432/auction_simulator
      CORS_ORIGINS: http://localhost:8501
    command: >
      sh -c "alembic upgrade head &&
             python3 -m scripts.seed_experiments &&
             uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: .
    environment:
      API_BASE_URL: http://api:8000/api/v1
    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  postgres_data:
